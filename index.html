<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>Notes</title>
    <link rel="stylesheet" href="tufte.css"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .site-header {
        align-items: baseline;
        display: flex;
        gap: 3rem;
        justify-content: space-between;
        padding: 1.4rem clamp(1.1rem, 5vw, 5rem) 1.05rem 0;
      }

      .site-wordmark {
        align-items: center;
        display: inline-flex;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        gap: 0.55rem;
        letter-spacing: 0.025em;
        text-decoration: none;
      }

      .site-wordmark img {
        display: block;
        flex: none;
        height: 1.65rem;
        width: 1.65rem;
      }

      .site-links {
        display: flex;
        flex-wrap: wrap;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
        font-size: 0.7rem;
        gap: 0.25rem 1.25rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .site-links a {
        color: #666;
        text-decoration: none;
      }

      .site-links a:hover,
      .site-links a:focus {
        color: #111;
      }

      .notes-list .publication-date {
        color: #666;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
        font-size: 0.9rem;
        margin-left: 0.65rem;
        white-space: nowrap;
      }

      @media (prefers-color-scheme: dark) {
        .site-links a,
        .notes-list .publication-date {
          color: #aaa;
        }

        .site-links a:hover,
        .site-links a:focus {
          color: #ddd;
        }
      }

      @media (max-width: 760px) {
        .site-header {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.85rem;
        }

        .notes-list .publication-date {
          display: block;
          margin-left: 0;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <a class="site-wordmark" href="index.html" aria-label="Notes home">
        <img src="favicon.png" alt=""/>
        <span>Notes</span>
      </a>
      <nav class="site-links" aria-label="Related sites">
        <a href="https://barasch.github.io/observatory/">Observatory</a>
        <a href="https://barasch.github.io/the-city/">The City</a>
      </nav>
    </header>

    <article>
      <h1 id="title">Notes</h1>
      <p class="subtitle">Welcome.</p>
      <section>
        <ul class="notes-list">
          <li><a href="observer-patch-holography-review.html">Reality in the Overlap — A Review of Observer Patch Holography</a> <time class="publication-date" datetime="2026-08-07">August 7, 2026</time></li>
        </ul>
      </section>
    </article>
  </body>
</html>
